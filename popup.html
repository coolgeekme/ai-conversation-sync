<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px; padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #131315; color: #e4e2e4;
    }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .subtitle { font-size: 10px; color: #8e9192; margin-bottom: 16px; font-family: 'JetBrains Mono', monospace; }
    
    .platform { 
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; margin-bottom: 6px; border-radius: 8px;
      background: #1b1b1d; border: 1px solid rgba(68,71,72,0.3);
    }
    .platform-name { font-size: 13px; font-weight: 500; }
    .platform-count { font-size: 11px; color: #8e9192; font-family: 'JetBrains Mono', monospace; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    
    button {
      width: 100%; padding: 12px; margin-top: 12px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
      background: white; color: #131315;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .status { margin-top: 10px; font-size: 11px; text-align: center; color: #8e9192; font-family: 'JetBrains Mono', monospace; }
    .error { color: #ffb4ab; }
    .success { color: #70ff76; }
    
    .dashboard-link {
      display: block; margin-top: 12px; padding: 8px; text-align: center;
      font-size: 11px; color: #3e90ff; text-decoration: none;
      border-radius: 6px; border: 1px solid rgba(62,144,255,0.2);
      font-family: 'JetBrains Mono', monospace;
    }
    .dashboard-link:hover { background: rgba(62,144,255,0.05); }
  </style>
</head>
<body>
  <h1>Conversation Sync</h1>
  <p class="subtitle">NO API KEYS · NO ACCOUNTS</p>
  
  <div id="platforms">
    <div class="platform"><span><span class="dot" style="background:#3e90ff"></span><span class="platform-name">ChatGPT</span></span><span class="platform-count" id="chatgpt-count">--</span></div>
    <div class="platform"><span><span class="dot" style="background:#D4A373"></span><span class="platform-name">Claude.ai</span></span><span class="platform-count" id="claude-count">--</span></div>
  </div>
  
  <button id="sync-btn">Sync Conversations</button>
  <div class="status" id="status"></div>
  <a class="dashboard-link" id="dashboard-link" href="#" target="_blank">Open Dashboard →</a>

  <script src="popup.js"></script>
</body>
</html>
